apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app
  namespace: lab-so
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
        - name: mi-app
          image: localhost:30500/utec/mi-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mi-app
  namespace: lab-so
spec:
  selector:
    app: mi-app
  ports:
    - port: 80
      targetPort: 80
