apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: entrada-web
  namespace: lab-so
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      # Puerto del entryPoint web de Traefik; ServiceLB publica el 80 del host hacia él.
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mi-app
  namespace: lab-so
spec:
  parentRefs:
    - name: entrada-web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mi-app
          port: 80
