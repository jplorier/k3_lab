apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samba-pvc
  namespace: lab-so
  labels:
    app: samba
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: lab-so
  labels:
    app: samba
data:
  smb.conf: |
    [global]
       workgroup = UTEC
       server string = Servidor Samba 4 en K3s (UTEC SO)
       server role = standalone server
       security = user
       map to guest = Bad User
       guest account = nobody
       log file = /dev/stdout
       max log size = 0
       smb ports = 445
       disable netbios = yes
       dns proxy = no
       load printers = no
       printing = bsd
       printcap name = /dev/null
       disable spoolss = yes

    [compartido]
       comment = Carpeta autenticada del laboratorio (usuario alumno)
       path = /datos/compartido
       browseable = yes
       read only = no
       guest ok = no
       valid users = alumno
       create mask = 0664
       directory mask = 0775

    [publico]
       comment = Carpeta publica de lectura y escritura sin clave
       path = /datos/publico
       browseable = yes
       read only = no
       guest ok = yes
       force user = alumno
       create mask = 0664
       directory mask = 0775
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: lab-so
  labels:
    app: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      containers:
        - name: samba
          image: dperson/samba:latest
          args:
            - "-p"
            - "-w"
            - "UTEC"
            - "-u"
            - "alumno;utec2026"
            - "-s"
            - "compartido;/datos/compartido;yes;no;no;alumno"
            - "-s"
            - "publico;/datos/publico;yes;no;yes;all"
          ports:
            - containerPort: 445
              name: smb
            - containerPort: 139
              name: netbios
          volumeMounts:
            - name: datos-samba
              mountPath: /datos
            - name: config-referencia
              mountPath: /etc/samba/smb.conf.referencia
              subPath: smb.conf
          readinessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: datos-samba
          persistentVolumeClaim:
            claimName: samba-pvc
        - name: config-referencia
          configMap:
            name: samba-config
---
apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: lab-so
  labels:
    app: samba
spec:
  type: NodePort
  selector:
    app: samba
  ports:
    - name: smb
      port: 445
      targetPort: 445
      nodePort: 30445
      protocol: TCP
    - name: netbios
      port: 139
      targetPort: 139
      nodePort: 30139
      protocol: TCP
