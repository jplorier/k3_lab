apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registro-pvc
  namespace: lab-so
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registro
  namespace: lab-so
spec:
  replicas: 1
  selector:
    matchLabels: {app: registro}
  template:
    metadata:
      labels: {app: registro}
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{containerPort: 5000}]
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: datos
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
            initialDelaySeconds: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 256Mi}
      volumes:
        - name: datos
          persistentVolumeClaim: {claimName: registro-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: registro
  namespace: lab-so
spec:
  type: NodePort
  selector: {app: registro}
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
