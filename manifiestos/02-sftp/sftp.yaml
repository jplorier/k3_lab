apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-pvc
  namespace: lab-so
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
  namespace: lab-so
spec:
  replicas: 1
  selector:
    matchLabels: {app: sftp}
  template:
    metadata:
      labels: {app: sftp}
    spec:
      initContainers:
        - name: preparar-datos
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /home/alumno/datos && chown -R 1001:100 /home/alumno/datos"]
          volumeMounts:
            - name: datos
              mountPath: /home/alumno
      containers:
        - name: sftp
          image: atmoz/sftp:alpine
          args: ["alumno:utec2026:1001:100:datos"]
          ports: [{containerPort: 22}]
          volumeMounts:
            - name: datos
              mountPath: /home/alumno/datos
          readinessProbe:
            tcpSocket: {port: 22}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: datos
          persistentVolumeClaim: {claimName: sftp-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: sftp
  namespace: lab-so
spec:
  type: NodePort
  selector: {app: sftp}
  ports:
    - port: 22
      targetPort: 22
      nodePort: 30022
