apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-datos-pvc
  namespace: lab-so
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 4Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: lab-so
spec:
  replicas: 0
  selector:
    matchLabels: {app: gitlab}
  template:
    metadata:
      labels: {app: gitlab}
    spec:
      initContainers:
        - name: preparar-directorios
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /datos/config /datos/logs /datos/data && chown -R 998:998 /datos"]
          volumeMounts:
            - {name: datos, mountPath: /datos}
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.11.0-ce.0
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost:30080'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                gitlab_rails['gitlab_shell_ssh_port'] = 30024
                puma['worker_processes'] = 0
                sidekiq['max_concurrency'] = 5
                prometheus_monitoring['enable'] = false
          ports:
            - {containerPort: 80}
            - {containerPort: 22}
          volumeMounts:
            - {name: datos, mountPath: /etc/gitlab, subPath: config}
            - {name: datos, mountPath: /var/log/gitlab, subPath: logs}
            - {name: datos, mountPath: /var/opt/gitlab, subPath: data}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 3Gi}
      volumes:
        - name: datos
          persistentVolumeClaim: {claimName: gitlab-datos-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: lab-so
spec:
  type: NodePort
  selector: {app: gitlab}
  ports:
    - {name: http, port: 80, targetPort: 80, nodePort: 30080}
    - {name: ssh, port: 22, targetPort: 22, nodePort: 30024}
